<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WaveTracer — 국내 서핑 파도 예보</title>
<meta name="description" content="양양·강릉·제주·부산 등 국내 서핑 포인트의 날짜별 파고·주기·파향·바람 예보를 한 페이지에서 확인하세요.">
<meta name="theme-color" content="#06121d">
<meta property="og:title" content="WaveTracer — 국내 서핑 파도 예보">
<meta property="og:description" content="원하는 날짜의 파고·주기·바람을 시간대별로. 국내 서핑 포인트 13곳.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">

<!-- PWA: 매니페스트 + 아이콘 + 서비스워커(js/main.js 에서 등록) 세 가지가
     갖춰져야 안드로이드 크롬이 "홈 화면에 추가"를 정식 설치로 제안한다. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WaveTracer">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="/css/app.css">

<!-- 진입점 하나만 부르고 나머지 모듈은 import 그래프를 따라 브라우저가 알아서
     가져온다 — 번들러도 빌드 스텝도 없다. type="module" 은 기본이 defer 라
     이 스크립트가 실행될 땐 아래 마크업이 이미 파싱돼 있다. -->
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div class="wrap">

  <header>
    <a href="/" class="logo" id="logo" data-nav><span class="mk">🌊</span>WaveTracer</a>
    <div class="tag">국내 서핑 포인트 파도 예보 · 최대 7일</div>
  </header>

  <nav class="tabs" id="tabs" aria-label="주요 메뉴">
    <a href="/" class="tab" data-nav data-route="home">홈</a>
    <a href="/forecast" class="tab" data-nav data-route="forecast">파도예보</a>
    <a href="/reports" class="tab" data-nav data-route="reports">파도제보</a>
    <a href="/sessions" class="tab" data-nav data-route="sessions">내 기록</a>
  </nav>

  <div class="controls" id="controls">
    <div class="ctl-row">
      <label class="fld">
        <span>포인트</span>
        <select id="spot" aria-label="서핑 포인트 선택"></select>
      </label>
      <label class="fld">
        <span>날짜</span>
        <input type="date" id="date" aria-label="예보 날짜 선택">
      </label>
    </div>
    <div class="days" id="days" role="group" aria-label="날짜 빠른 선택"></div>
  </div>

  <div id="app"></div>

  <!-- 광고 슬롯. 라우터 밖에 있어서 4개 화면 어디서나 하단에 그대로 뜬다.
       실제 광고가 들어오면 .ad-banner 안쪽만 통째로 갈아끼우면 되고,
       배너 자체가 필요 없어지면 이 블록을 지우면 된다. 지금은 광고가 없어서
       자체 안내(하우스) 배너를 띄워둔다. -->
  <aside class="ad-slot" id="ad-slot" aria-label="광고 영역">
    <div class="ad-label">Advertisement</div>
    <div class="ad-banner">
      <div class="ad-title">광고주를 모십니다</div>
      <div class="ad-sub">
        국내 서핑 포인트의 파도 예보를 확인하는 이용자에게<br>
        브랜드를 알릴 수 있는 자리입니다.
      </div>
      <div class="ad-note">광고 문의 환영</div>
    </div>
  </aside>

  <footer>
    데이터 · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> Marine &amp; Weather API<br>
    예보는 참고용입니다. 입수 전 반드시 현장 상황과 기상특보를 확인하세요.
  </footer>
</div>

<!-- AI 챗봇. .wrap 바깥(라우터 밖)이라 어느 화면에서든 그대로 떠 있다.
     데스크톱은 오른쪽 사이드 패널, 모바일은 전체화면 시트로 열린다 — DOM 은
     하나고 CSS 미디어쿼리로만 갈린다. -->
<button type="button" id="chat-fab" class="chat-fab" aria-label="AI 도우미 열기" title="AI 도우미" aria-expanded="false">
  <span class="chat-fab-ic" aria-hidden="true">💬</span>
</button>
<div id="chat-scrim" class="chat-scrim" hidden></div>
<aside id="chat" class="chat" hidden aria-label="AI 도우미" role="dialog" aria-modal="false">
  <div id="chat-grab" class="chat-grab" aria-hidden="true"></div>
  <header class="chat-head">
    <div>
      <div class="chat-title">WaveTracer 도우미</div>
      <div class="chat-sub">안전·규정, 오늘 좋은 포인트를 물어보세요</div>
    </div>
    <button type="button" id="chat-close" class="chat-close" aria-label="도우미 최소화" title="최소화">✕</button>
  </header>
  <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
  <div id="chat-chips" class="chat-chips"></div>
  <form id="chat-form" class="chat-form" novalidate>
    <input id="chat-input" type="text" maxlength="500" placeholder="무엇이든 물어보세요" autocomplete="off">
    <button type="submit" id="chat-send" class="chat-send" aria-label="보내기">↑</button>
  </form>
</aside>
</body>
</html>
