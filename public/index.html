<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WaveTracer — 국내 서핑 파도 예보</title>
<meta name="description" content="양양·강릉·제주·부산 등 국내 서핑 포인트의 날짜별 파고·주기·파향·바람 예보를 한 페이지에서 확인하세요.">
<meta name="theme-color" content="#06121d">
<meta property="og:title" content="WaveTracer — 국내 서핑 파도 예보">
<meta property="og:description" content="원하는 날짜의 파고·주기·바람을 시간대별로. 국내 서핑 포인트 13곳.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#06121d; --bg2:#0a1c2b;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.1);
  --line-strong:rgba(255,255,255,.18);
  --text:#e8f2f8; --muted:#8fa8ba; --dim:#63798a;
  --accent:#38bdf8; --accent-2:#22d3ee;
  --r-exc:#34d399; --r-good:#a3e635; --r-fair:#fbbf24; --r-poor:#fb923c; --r-flat:#64748b;
  --adv-ok:#34d399; --adv-warn:#f59e0b; --adv-danger:#f43f5e; --adv-pending:#94a3b8;
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Consolas",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100vh;
}
/* 고정 배경은 별도 레이어로. body 에 background-attachment:fixed 를 주면
   스크롤마다 전면 리페인트가 일어나 iOS 에서 버벅이고 합성이 깨진다. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(56,189,248,.16), transparent 62%),
    radial-gradient(900px 520px at 8% 0%, rgba(34,211,238,.09), transparent 60%);
}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}

/* ---------- header ---------- */
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{
  font-size:23px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;
  color:inherit;text-decoration:none;cursor:pointer;border-radius:10px;padding:4px 7px;margin:-4px -7px;
  transition:background .15s;
}
.logo:hover{background:var(--surface)}
.logo:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.logo .mk{
  font-size:20px;filter:drop-shadow(0 2px 6px rgba(56,189,248,.55));
  animation:bob 3.4s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.tag{font-size:12.5px;color:var(--muted)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{
  flex:0 0 auto;padding:9px 16px;border-radius:12px;cursor:pointer;font-family:inherit;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  font-weight:650;font-size:13.5px;text-decoration:none;transition:.16s;
}
.tab:hover{background:var(--surface-2);border-color:var(--line-strong);color:var(--text)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab[aria-current="page"]{
  background:rgba(56,189,248,.16);border-color:var(--accent);color:var(--text);
  box-shadow:0 0 0 1px rgba(56,189,248,.3);
}

/* ---------- controls ---------- */
.controls{display:grid;gap:12px;margin-bottom:18px}
#controls[hidden]{display:none} /* .controls 의 display:grid 가 기본 hidden 스타일보다 우선하므로 명시적으로 덮어씀 */
.ctl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.fld{
  display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:9px 13px;
  transition:border-color .18s, background .18s;
}
label.fld:focus-within{border-color:rgba(56,189,248,.6);background:var(--surface-2)}
label.fld > span{font-size:11px;font-weight:650;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
select,input[type=date]{
  background:transparent;border:0;color:var(--text);font:inherit;font-size:14.5px;
  font-weight:550;outline:none;cursor:pointer;max-width:230px;
}
select option,select optgroup{background:#0d2133;color:var(--text)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.75) sepia(1) saturate(3) hue-rotate(165deg);cursor:pointer}

.days{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{height:5px}
.days::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.day{
  flex:0 0 auto;min-width:64px;padding:8px 11px;border-radius:12px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);text-align:center;
  transition:.16s;font-family:inherit;color:inherit;
}
.day:hover{background:var(--surface-2);border-color:var(--line-strong)}
.day[aria-pressed=true]{background:rgba(56,189,248,.16);border-color:var(--accent);box-shadow:0 0 0 1px rgba(56,189,248,.3)}
.day .dow{font-size:10.5px;color:var(--muted);font-weight:650;letter-spacing:.04em;display:block}
.day .dnum{font-size:16px;font-weight:700;margin-top:1px;letter-spacing:-.01em;display:block}
.day[aria-pressed=true] .dow{color:var(--accent)}
.day.sat .dow{color:#7fb6ff} .day.sun .dow{color:#ff9aa8}
.day .pill{display:block;height:3px;border-radius:2px;margin-top:5px;background:var(--line-strong)}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(150deg, rgba(255,255,255,.075), rgba(255,255,255,.028));
  border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;
  display:grid;gap:18px;grid-template-columns:minmax(0,1fr) auto;align-items:center;
}
.hero-l{min-width:0}
.spot-name{font-size:21px;font-weight:730;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.spot-region{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2.5px 8px;border-radius:999px}
.hero-date{font-size:13px;color:var(--muted);margin-top:3px}
.metrics{display:flex;gap:22px;flex-wrap:wrap;margin-top:15px}
.m{min-width:0}
.m .k{font-size:10.5px;color:var(--dim);font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.m .v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.m .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:1px}
.m .s{font-size:11.5px;color:var(--muted);margin-top:1px}

.score{text-align:center;padding:4px 6px}
.score .ring{position:relative;width:104px;height:104px;margin:0 auto}
.score .ring .lbl{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
}
.score .ring .num{font-size:27px;font-weight:760;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.score .ring .of{font-size:10px;color:var(--dim);font-weight:600;margin-top:2px}
.score .grade{font-size:14px;font-weight:720;margin-top:8px;letter-spacing:-.01em}
.score .best{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}

/* ---------- card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.card h2{margin:0 0 3px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.card .sub{font-size:11.5px;color:var(--dim);margin-bottom:14px}

.chart-box{position:relative;width:100%}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.tip{
  position:absolute;pointer-events:none;background:#0d2436;border:1px solid var(--line-strong);
  border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.65;white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;z-index:5;top:0;left:0;
}
.tip.on{opacity:1}
.tip b{font-size:12.5px}
.tip .r{color:var(--muted)}

/* ---------- table ---------- */
.tscroll{overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:thin}
.tscroll::-webkit-scrollbar{height:6px}
.tscroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{
  text-align:left;font-size:10.5px;font-weight:650;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;
  padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;
}
th.num,td.num{text-align:right}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover,tbody tr.hl{background:rgba(56,189,248,.08)}
tbody tr.now{background:rgba(56,189,248,.13)}
tbody tr.now td:first-child::after{content:"지금";font-size:9.5px;font-weight:700;color:var(--accent);margin-left:6px;letter-spacing:.04em}
td.time{font-weight:650;font-family:var(--mono);font-size:13px}
.wv{font-weight:700;font-size:14.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.arw{width:15px;height:15px;vertical-align:-3px;opacity:.85}
.badge{font-size:10.5px;font-weight:670;padding:2px 7px;border-radius:999px;letter-spacing:.02em}

/* ---------- 입수 가능 여부(풍랑특보) 배너 ---------- */
.advisory{
  display:flex;flex-direction:column;gap:11px;padding:13px 18px;border-radius:var(--radius);
  margin-bottom:14px;border:1px solid var(--line);background:var(--surface);
}
.advisory-top{display:flex;align-items:center;gap:12px}
.advisory .adv-ic{font-size:19px;line-height:1;flex:0 0 auto}
.advisory .adv-main{min-width:0;flex:1}
.advisory .adv-label{font-size:14.5px;font-weight:720;letter-spacing:-.01em}
.advisory .adv-detail{font-size:12.5px;color:var(--muted);margin-top:1px}
.advisory .adv-note{font-size:10.5px;color:var(--dim);white-space:nowrap;flex:0 0 auto;text-align:right}
.advisory .adv-note a{color:inherit;text-decoration:underline;text-decoration-color:var(--line-strong)}
.advisory .adv-note a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.advisory.adv-0{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.28)}
.advisory.adv-0 .adv-label{color:var(--adv-ok)}
.advisory.adv-1{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.32)}
.advisory.adv-1 .adv-label{color:var(--adv-warn)}
.advisory.adv-2{background:rgba(244,63,94,.13);border-color:rgba(244,63,94,.35)}
.advisory.adv-2 .adv-label{color:var(--adv-danger)}
.advisory.adv-pending{background:rgba(148,163,184,.08);border-color:var(--line)}
.advisory.adv-pending .adv-label{color:var(--adv-pending)}
@media (max-width:560px){ .advisory .adv-note{display:none} }

/* 풍랑주의보일 때만 뜨는 "신고하러 가기" — 배너 안에서 가장 눈에 띄어야 하는 요소라
   경고색 자체를 버튼 배경으로 써서 본문과 구분한다. */
.adv-cta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:31px}
.adv-cta{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.45);color:#fcd34d;
  font-size:12.5px;font-weight:680;padding:8px 14px;border-radius:10px;
  text-decoration:none;letter-spacing:-.01em;transition:.15s;
}
.adv-cta:hover{background:rgba(245,158,11,.3);border-color:rgba(245,158,11,.65)}
.adv-cta-hint{font-size:11px;color:var(--dim)}
@media (max-width:560px){ .adv-cta-row{padding-left:0} .adv-cta-hint{display:none} }
.b-off{background:rgba(52,211,153,.17);color:#5eead4}
.b-on{background:rgba(251,146,60,.17);color:#fdba74}
.b-side{background:rgba(148,163,184,.16);color:#cbd5e1}
.muted{color:var(--muted)}
.dimc{color:var(--dim)}
.unit{color:var(--muted);font-size:11.5px}

/* ---------- states ---------- */
.state{padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.spin{
  width:26px;height:26px;border:2.5px solid var(--line-strong);border-top-color:var(--accent);
  border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 13px;
}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#fca5a5}
.retry{
  margin-top:14px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--text);
  font:inherit;font-size:13px;font-weight:600;padding:8px 17px;border-radius:10px;cursor:pointer;transition:.15s;
}
.retry:hover{background:rgba(56,189,248,.16);border-color:var(--accent)}

/* ---------- 홈: 더 보기 링크 ---------- */
.home-more{color:var(--accent);text-decoration:none;font-size:13px;font-weight:650}
.home-more:hover{text-decoration:underline}
.home-more-row{text-align:right;margin-top:12px}

/* ---------- 파도 제보 카드 ---------- */
.report-list{display:grid;gap:12px}
.report-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.report-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.spot-badge{background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.report-nick{font-weight:650;font-size:13.5px}
.report-time{font-size:11.5px;margin-left:auto;white-space:nowrap}
.report-stars{color:var(--accent-2);font-size:13px;margin-bottom:5px;letter-spacing:1px}
.report-body{margin:0;font-size:13.5px;line-height:1.65;color:var(--text);word-break:break-word;white-space:pre-wrap}
.report-wh{font-size:11.5px;margin-top:7px}

/* ---------- 파도 제보 작성 폼 ---------- */
.rform{display:grid;gap:12px;margin-top:6px}
.rf-row{display:flex;gap:10px;flex-wrap:wrap}
.rf-row .fld{flex:1 1 200px}
.rf-row .fld select,.rf-row .fld input{max-width:none;width:100%}
input[type=text],input[type=number]{
  background:transparent;border:0;color:var(--text);font:inherit;font-size:14.5px;
  font-weight:550;outline:none;width:100%;
}
.rf-textarea-wrap{display:flex;flex-direction:column;gap:6px}
.rf-textarea-wrap>span{font-size:11px;font-weight:650;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
textarea#rf-body{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font:inherit;font-size:14px;padding:11px 13px;resize:vertical;min-height:96px;outline:none;
  transition:border-color .18s,background .18s;width:100%;
}
textarea#rf-body:focus{border-color:rgba(56,189,248,.6);background:var(--surface-2)}
.rf-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rf-count{font-size:11.5px}
.rf-submit{
  background:rgba(56,189,248,.16);border:1px solid var(--accent);color:var(--text);font:inherit;font-weight:650;
  font-size:13.5px;padding:9px 20px;border-radius:10px;cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:8px;
}
.rf-submit:hover:not(:disabled){background:rgba(56,189,248,.26)}
.rf-submit:disabled{opacity:.6;cursor:default}
.rf-spin{
  width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:sp .6s linear infinite;display:inline-block;flex:0 0 auto;
}
.rf-msg{font-size:12.5px;min-height:16px}
.rf-msg.rf-err{color:#fca5a5}
.rf-msg.rf-ok{color:var(--r-exc)}

/* ---------- legend / footer ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:5px}
footer{margin-top:26px;font-size:11.5px;color:var(--dim);line-height:1.85;text-align:center}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-strong)}
footer a:hover{color:var(--accent)}

@media (max-width:720px){
  .wrap{padding:16px 13px 48px}
  .hero{grid-template-columns:1fr;gap:14px;padding:17px}
  .score{display:flex;align-items:center;gap:16px;text-align:left;justify-content:flex-start;
    border-top:1px solid var(--line);padding-top:15px}
  .score .ring{margin:0;flex:0 0 auto}
  .score .grade{margin-top:0}
  .metrics{gap:16px}
  .m .v{font-size:17px}
  select{max-width:170px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a href="/" class="logo" id="logo" data-nav><span class="mk">🌊</span>WaveTracer</a>
    <div class="tag">국내 서핑 포인트 파도 예보 · 최대 7일</div>
  </header>

  <nav class="tabs" id="tabs" aria-label="주요 메뉴">
    <a href="/" class="tab" data-nav data-route="home">홈</a>
    <a href="/forecast" class="tab" data-nav data-route="forecast">파도예보</a>
    <a href="/reports" class="tab" data-nav data-route="reports">파도제보</a>
  </nav>

  <div class="controls" id="controls">
    <div class="ctl-row">
      <label class="fld">
        <span>포인트</span>
        <select id="spot" aria-label="서핑 포인트 선택"></select>
      </label>
      <label class="fld">
        <span>날짜</span>
        <input type="date" id="date" aria-label="예보 날짜 선택">
      </label>
    </div>
    <div class="days" id="days" role="group" aria-label="날짜 빠른 선택"></div>
  </div>

  <div id="app"></div>

  <footer>
    데이터 · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> Marine &amp; Weather API<br>
    예보는 참고용입니다. 입수 전 반드시 현장 상황과 기상특보를 확인하세요.
  </footer>
</div>

<script>
"use strict";

/* ============================ 데이터: 서핑 포인트 ============================
   lat/lon : 해변 실제 위치 (바람·기온 조회용)
   sea     : 파랑 모델 격자에 걸리는 앞바다 좌표 (해상 데이터 조회용)
   facing  : 해변이 바라보는 방위(도). 이 방향에서 너울이 들어온다.
============================================================================ */
const SPOTS = [
  { id:"sampo",    name:"삼포 해변",   region:"강원 고성",   lat:38.2650, lon:128.5620, sea:[38.2650,128.5950], facing:80  },
  { id:"hajodae",  name:"하조대 해변", region:"강원 양양",   lat:38.0480, lon:128.6960, sea:[38.0480,128.7300], facing:85  },

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pad = n => String(n).padStart(2, "0");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const isNum = v => typeof v === "number" && Number.isFinite(v);

const DOW  = ["일","월","화","수","목","금","토"];
const DIRS = ["북","북북동","북동","동북동","동","동남동","남동","남남동",
              "남","남남서","남서","서남서","서","서북서","북서","북북서"];
const dirName = d => DIRS[Math.round((((d % 360) + 360) % 360) / 22.5) % 16];

const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

/** 한국 시간(KST) 기준 '지금'을 로컬 Date 필드에 담아 반환 */
function nowKST(){
  const p = {};
  new Intl.DateTimeFormat("en-CA", {
    timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hour12:false
  }).formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  const hh = +p.hour === 24 ? 0 : +p.hour;
  return new Date(+p.year, +p.month - 1, +p.day, hh, +p.minute);
}

/** 구간 선형 보간 점수 */
function curve(v, pts){
  if (!isNum(v)) return 0;
  if (v <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++){
    const x0 = pts[i-1][0], y0 = pts[i-1][1], x1 = pts[i][0], y1 = pts[i][1];
    if (v <= x1) return y0 + (y1 - y0) * (v - x0) / (x1 - x0);
  }
  return pts[pts.length - 1][1];
}

/* ============================ 컨디션 점수 ============================ */
const SIZE_C   = [[0,0],[0.3,12],[0.6,48],[0.9,78],[1.3,96],[2.0,100],[2.8,82],[3.8,48],[5.0,18],[7,0]];
const PERIOD_C = [[3,8],[5,32],[7,60],[9,82],[11,95],[13,100],[18,100]];
const WIND_C   = [[0,100],[2,97],[4,84],[6,64],[8,44],[11,22],[15,6],[22,0]];

/**
 * 오프쇼어 정도: +1 완전 오프쇼어(육지→바다), -1 완전 온쇼어.
 * windDir 은 '바람이 불어오는 방위'(기상 관례) → 오프쇼어는 facing+180 에서 분다.
 */
function offshoreness(windDir, facing){
  if (!isNum(windDir)) return 0;
  return Math.cos((windDir - (facing + 180)) * Math.PI / 180);
}

function scoreHour(h){
  const hgt = (isNum(h.swellH) && h.swellH > 0.05) ? h.swellH : h.waveH;
  const per = (isNum(h.swellP) && h.swellP > 0)    ? h.swellP : h.waveP;
  if (!isNum(hgt)) return null;

  const sz  = curve(hgt, SIZE_C);
  const pd  = curve(per, PERIOD_C);
  const off = h.off;
  const spd = isNum(h.windSpd) ? h.windSpd : 0;
  // 바람 = 세기 기본점 + 오프쇼어 보정(바람이 셀수록 방향의 영향이 커짐)
  const wd  = clamp(curve(spd, WIND_C) + off * Math.min(spd, 11) * 3.4, 0, 100);

  return Math.round(sz * 0.42 + pd * 0.24 + wd * 0.34);
}

const GRADES = [
  [78, "최상",   "var(--r-exc)"],
  [62, "좋음",   "var(--r-good)"],
  [45, "보통",   "var(--r-fair)"],
  [27, "아쉬움", "var(--r-poor)"],
  [-1, "잔잔함", "var(--r-flat)"]
];
const grade = s => GRADES.find(g => (isNum(s) ? s : -1) > g[0]);

function windLabel(off){
  if (off >  0.42) return ["오프쇼어", "b-off"];
  if (off < -0.42) return ["온쇼어",   "b-on"];
  return ["사이드", "b-side"];
}

/* ============================ API ============================ */
const MARINE_VARS = "wave_height,wave_direction,wave_period,swell_wave_height," +
                    "swell_wave_direction,swell_wave_period,wind_wave_height,sea_surface_temperature";
const AIR_VARS = "wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m";
const DAYS = 7;

async function getJSON(url){
  const res = await fetch(url);
  if (!res.ok){
    let msg = "HTTP " + res.status;
    try { const j = await res.json(); if (j && j.reason) msg = j.reason; } catch (_){}
    throw new Error(msg);
  }
  return res.json();
}

const marineURL = (lat, lon, vars) =>
  "https://marine-api.open-meteo.com/v1/marine?latitude=" + lat.toFixed(4) +
  "&longitude=" + lon.toFixed(4) + "&hourly=" + vars +
  "&timezone=Asia%2FSeoul&forecast_days=" + DAYS;

/** 격자가 육지로 판정돼 전부 null 이면 앞바다 쪽으로 조금씩 밀어가며 재시도 */
async function fetchMarine(spot){
  const lat0 = spot.sea[0], lon0 = spot.sea[1];
  const rad = spot.facing * Math.PI / 180;
  const steps = [0, 0.06, 0.13, 0.22];
  let lastErr = null;

  for (const step of steps){
    const lat = lat0 + Math.cos(rad) * step;
    const lon = lon0 + Math.sin(rad) * step / Math.cos(lat0 * Math.PI / 180);
    try {
      let d;
      try {
        d = await getJSON(marineURL(lat, lon, MARINE_VARS));
      } catch (_){
        // 일부 격자는 수온을 제공하지 않음 → 제외하고 1회 재시도
        d = await getJSON(marineURL(lat, lon, MARINE_VARS.replace(",sea_surface_temperature", "")));
      }
      if (d && d.hourly && d.hourly.wave_height && d.hourly.wave_height.some(isNum)) return d;
      lastErr = new Error("해당 좌표에 파랑 모델 데이터가 없습니다.");
    } catch (e){ lastErr = e; }
  }
  throw lastErr || new Error("해상 데이터를 불러오지 못했습니다.");
}

const cache = new Map();

async function loadSpot(spot){
  if (cache.has(spot.id)) return cache.get(spot.id);

  const airURL = "https://api.open-meteo.com/v1/forecast?latitude=" + spot.lat +
    "&longitude=" + spot.lon + "&hourly=" + AIR_VARS +
    "&timezone=Asia%2FSeoul&forecast_days=" + DAYS + "&wind_speed_unit=ms";

  const both = await Promise.all([ fetchMarine(spot), getJSON(airURL) ]);
  const M = both[0].hourly, A = both[1].hourly;
  const airAt = new Map(A.time.map((t, i) => [t, i]));
  const pick = (arr, i) => (arr && arr[i] != null) ? arr[i] : null;

  const byDate = new Map();
  M.time.forEach((t, i) => {
    const j = airAt.has(t) ? airAt.get(t) : -1;
    const h = {
      time: t,
      hour: +t.slice(11, 13),
      waveH:  pick(M.wave_height, i),
      waveD:  pick(M.wave_direction, i),
      waveP:  pick(M.wave_period, i),
      swellH: pick(M.swell_wave_height, i),
      swellD: pick(M.swell_wave_direction, i),
      swellP: pick(M.swell_wave_period, i),
      windWH: pick(M.wind_wave_height, i),
      seaT:   pick(M.sea_surface_temperature, i),
      windSpd: j < 0 ? null : pick(A.wind_speed_10m, j),
      windDir: j < 0 ? null : pick(A.wind_direction_10m, j),
      gust:    j < 0 ? null : pick(A.wind_gusts_10m, j),
      airT:    j < 0 ? null : pick(A.temperature_2m, j)
    };
    h.off = offshoreness(h.windDir, spot.facing);
    h.score = scoreHour(h);
    const d = t.slice(0, 10);
    if (!byDate.has(d)) byDate.set(d, []);
    byDate.get(d).push(h);
  });

  const data = { byDate: byDate, dates: Array.from(byDate.keys()).sort() };
  cache.set(spot.id, data);
  return data;
}

/* ============================ 하루 요약 ============================ */
function summarize(hours){
  const valid = hours.filter(h => isNum(h.score));
  if (!valid.length) return null;

  const peak = valid.reduce((a, b) => (b.waveH || 0) > (a.waveH || 0) ? b : a);
  const avg  = Math.round(valid.reduce((s, h) => s + h.score, 0) / valid.length);

  // 추천 시간대: 05~20시 중 최고점에서 좌우로 -10점 이내까지 확장
  const day = valid.filter(h => h.hour >= 5 && h.hour <= 20);
  const pool = day.length ? day : valid;
  const top = pool.reduce((a, b) => b.score > a.score ? b : a);
  const idx = pool.indexOf(top);
  let a = idx, b = idx;
  while (a > 0 && pool[a-1].score >= top.score - 10) a--;
  while (b < pool.length - 1 && pool[b+1].score >= top.score - 10) b++;

  const seaTs = valid.map(h => h.seaT).filter(isNum);
  const winds = valid.map(h => h.windSpd).filter(isNum);
  const pers  = valid.map(h => isNum(h.swellP) ? h.swellP : h.waveP).filter(isNum);
  const dirs  = valid.map(h => isNum(h.swellD) ? h.swellD : h.waveD).filter(isNum);

  // 하루의 바람 성향: 시간별 오프쇼어도를 풍속으로 가중 평균.
  // (최고점 한 시간의 풍향만 쓰면 나머지 23시간과 어긋난 라벨이 나온다)
  const wh = valid.filter(h => isNum(h.windDir) && isNum(h.windSpd));
  const wsum = wh.reduce((s, h) => s + Math.max(h.windSpd, 0.5), 0);
  const offAvg = wsum > 0
    ? wh.reduce((s, h) => s + h.off * Math.max(h.windSpd, 0.5), 0) / wsum
    : 0;

  return {
    avg: avg,
    top: top,
    offAvg: offAvg,
    best: { from: pool[a].hour, to: pool[b].hour },
    peakWave: peak.waveH,
    peakPeriod: pers.length ? Math.max.apply(null, pers) : null,
    windAvg: winds.length ? winds.reduce((s, v) => s + v, 0) / winds.length : null,
    seaT: seaTs.length ? seaTs.reduce((s, v) => s + v, 0) / seaTs.length : null,
    dirMode: dirs.length ? dirs[Math.floor(dirs.length / 2)] : null
  };
}

const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function arrowSVG(deg){
  if (!isNum(deg)) return '<span class="dimc">–</span>';
  return '<svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
    'stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (deg + 180).toFixed(0) + 'deg)" ' +
    'aria-hidden="true"><path d="M12 21V4M12 4l-5.5 6M12 4l5.5 6"/></svg>';
}

/* 차트 기하 — 렌더와 상호작용이 같은 값을 쓰도록 한 곳에 모음 */
const CH = { W:720, H:210, L:38, R:14, T:14, B:40 };
CH.iw = CH.W - CH.L - CH.R;
CH.ih = CH.H - CH.T - CH.B;
const yMaxOf = hours => {
  const vs = hours.map(h => h.waveH).filter(isNum);
  return Math.ceil(Math.max.apply(null, [0.6].concat(vs)) * 1.25 * 4) / 4;
};
const chartX = (i, n) => CH.L + (n > 1 ? i / (n - 1) : 0.5) * CH.iw;
const chartY = (v, yMax) => CH.T + CH.ih - (clamp(isNum(v) ? v : 0, 0, yMax) / yMax) * CH.ih;

function renderChart(hours){
  const n = hours.length, yMax = yMaxOf(hours);
  const pts = hours.map((h, i) => chartX(i, n).toFixed(1) + "," + chartY(h.waveH, yMax).toFixed(1));
  const line = "M" + pts.join("L");
  const base = (CH.T + CH.ih).toFixed(1);
  const area = line + "L" + chartX(n-1, n).toFixed(1) + "," + base +
                      "L" + chartX(0, n).toFixed(1) + "," + base + "Z";

  const ticks = [0, yMax/2, yMax].map(v => {
    const y = chartY(v, yMax).toFixed(1);
    return '<line x1="' + CH.L + '" y1="' + y + '" x2="' + (CH.W - CH.R) + '" y2="' + y +
      '" stroke="rgba(255,255,255,.09)" stroke-width="1"/>' +
      '<text x="' + (CH.L - 8) + '" y="' + (+y + 4).toFixed(1) + '" text-anchor="end" font-size="10.5" ' +
      'fill="#63798a" font-variant-numeric="tabular-nums">' + v.toFixed(1) + '</text>';
  }).join("");

  const bw = CH.iw / n;
  const strip = hours.map((h, i) => {
    const g = grade(h.score);
    const op = isNum(h.score) ? (0.28 + (h.score / 100) * 0.72) : 0.18;
    return '<rect x="' + (CH.L + i * bw + 0.6).toFixed(1) + '" y="' + (CH.T + CH.ih + 9).toFixed(1) +
      '" width="' + Math.max(1, bw - 1.2).toFixed(1) + '" height="7" rx="2" fill="' + g[2] +
      '" opacity="' + op.toFixed(2) + '"/>';
  }).join("");

  const xlab = hours.map((h, i) => i % 3 === 0
    ? '<text x="' + chartX(i, n).toFixed(1) + '" y="' + (CH.H - 6) + '" text-anchor="middle" font-size="10.5" ' +
      'fill="#63798a" font-variant-numeric="tabular-nums">' + pad(h.hour) + '</text>'
    : "").join("");

  const hits = hours.map((h, i) =>
    '<rect class="hit" data-i="' + i + '" x="' + (chartX(i, n) - bw / 2).toFixed(1) + '" y="' + CH.T +
    '" width="' + bw.toFixed(1) + '" height="' + (CH.ih + 18) + '" fill="transparent" style="pointer-events:all"/>'
  ).join("");

  return '<div class="chart-box">' +
    '<svg class="chart" viewBox="0 0 ' + CH.W + ' ' + CH.H + '" role="img" ' +
    'aria-label="시간대별 파고 그래프">' +
      '<defs><linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#38bdf8" stop-opacity=".42"/>' +
        '<stop offset="100%" stop-color="#38bdf8" stop-opacity=".02"/>' +
      '</linearGradient></defs>' +
      ticks +
      '<path d="' + area + '" fill="url(#g-area)"/>' +
      '<path d="' + line + '" fill="none" stroke="#38bdf8" stroke-width="2.2" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>' +
      strip + xlab +
      '<line id="cursor" x1="0" y1="' + CH.T + '" x2="0" y2="' + (CH.T + CH.ih) +
      '" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>' +
      '<circle id="cdot" r="4" fill="#38bdf8" stroke="#06121d" stroke-width="2" opacity="0"/>' +
      hits +
    '</svg><div class="tip" id="tip"></div></div>';
}

function renderTable(hours){
  const now = nowKST();
  const todayStr = ymd(now);
  const rows = hours.map((h, i) => {
    const g = grade(h.score);
    const wl = windLabel(h.off);
    const isNow = h.time.slice(0, 10) === todayStr && h.hour === now.getHours();
    const per = isNum(h.swellP) ? h.swellP : h.waveP;
    const dir = isNum(h.swellD) ? h.swellD : h.waveD;
    return '<tr data-i="' + i + '" class="' + (isNow ? "now" : "") + '">' +

      '<td class="num">' + (isNum(per) ? per.toFixed(0) : "–") + '<span class="unit"> s</span></td>' +

    '</tr></thead><tbody id="tbody">' + rows + '</tbody></table></div>';
}

/* 차트 ↔ 표 상호작용 */
function wireChart(hours){
  const svg = $("svg.chart");
  if (!svg) return;
  const tip = $("#tip"), box = $(".chart-box"), cur = $("#cursor"), dot = $("#cdot"), tbody = $("#tbody");
  const n = hours.length, yMax = yMaxOf(hours);

  const clear = () => {
    tip.classList.remove("on");
    cur.setAttribute("opacity", "0");
    dot.setAttribute("opacity", "0");
    if (tbody) tbody.querySelectorAll("tr.hl").forEach(r => r.classList.remove("hl"));
  };

  const show = i => {
    const h = hours[i], g = grade(h.score);
    const x = chartX(i, n), y = chartY(h.waveH, yMax);

    cur.setAttribute("x1", x); cur.setAttribute("x2", x); cur.setAttribute("opacity", ".7");
    dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("opacity", "1");

    const per = isNum(h.swellP) ? h.swellP : h.waveP;
    tip.innerHTML =
      "<b>" + pad(h.hour) + ':00</b> &nbsp;<span style="color:' + g[2] + ';font-weight:650">' + g[1] + "</span><br>" +
      '<span class="r">파고</span> ' + (isNum(h.waveH) ? h.waveH.toFixed(1) + " m" : "–") + " · " +
      '<span class="r">주기</span> ' + (isNum(per) ? per.toFixed(0) + " s" : "–") + "<br>" +
      '<span class="r">바람</span> ' + (isNum(h.windSpd) ? h.windSpd.toFixed(1) + " m/s" : "–") + " " +
      (isNum(h.windDir) ? dirName(h.windDir) : "");
    tip.classList.add("on");

    const bw = box.clientWidth, bh = box.clientHeight;
    tip.style.left = "0px";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp((x / CH.W) * bw - tw / 2, 2, Math.max(2, bw - tw - 2)) + "px";
    tip.style.top  = Math.max(0, (y / CH.H) * bh - th - 12) + "px";

    if (tbody){
      tbody.querySelectorAll("tr.hl").forEach(r => r.classList.remove("hl"));
      const row = tbody.querySelector('tr[data-i="' + i + '"]');
      if (row) row.classList.add("hl");
    }
  };

  // 마우스는 hover 로 훑고, 터치는 탭으로 찍는다.
  // 터치 드래그는 가로채지 않는다 — 그래프 위에서도 세로 스크롤이 되어야 하므로
  // preventDefault 도, touch-action:none 도 걸지 않는다.
  svg.querySelectorAll(".hit").forEach(el => {
    const i = +el.dataset.i;
    el.addEventListener("pointerenter", ev => { if (ev.pointerType === "mouse") show(i); });
    el.addEventListener("pointerdown", () => show(i));
  });
  svg.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse") clear(); });
  svg.addEventListener("pointercancel", clear);
}

/* ============================ 상태 & 라우팅 ============================ */
const state = { spot: "jukdo", date: ymd(nowKST()) };

function readURL(){
  const q = new URLSearchParams(location.search);
  const s = q.get("spot"), d = q.get("date");
  if (s && SPOTS.some(x => x.id === s)) state.spot = s;
  if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) state.date = d;
}
function writeURL(){
  // 이 함수는 /forecast 라우트에 있을 때만 호출된다 — 경로를 직접 못박아 둔다.
  history.replaceState(null, "", "/forecast?" + new URLSearchParams({ spot: state.spot, date: state.date }));
}

function buildSpotSelect(){
  const sel = $("#spot");
  const groups = [];
  SPOTS.forEach(s => { const g = s.region.split(" ")[0]; if (groups.indexOf(g) < 0) groups.push(g); });
  sel.innerHTML = groups.map(g =>
    '<optgroup label="' + esc(g) + '">' +
    SPOTS.filter(s => s.region.indexOf(g) === 0).map(s =>
      '<option value="' + s.id + '">' + esc(s.name) + " · " + esc(s.region.split(" ")[1] || "") + "</option>").join("") +
    "</optgroup>").join("");
  sel.value = state.spot;
}

function buildDays(dates, data){
  const el = $("#days");
  const today = ymd(nowKST());
  el.innerHTML = dates.map(ds => {
    const d = new Date(ds + "T00:00:00");
    const sm = summarize(data.byDate.get(ds) || []);
    const g = grade(sm ? sm.avg : null);
    const cls = d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : "";
    const op = sm ? (0.3 + (sm.avg / 100) * 0.7).toFixed(2) : "0.35";
    return '<button class="day ' + cls + '" type="button" data-d="' + ds + '" aria-pressed="' + (ds === state.date) + '">' +
      '<span class="dow">' + (ds === today ? "오늘" : DOW[d.getDay()]) + "</span>" +
      '<span class="dnum">' + d.getDate() + "</span>" +
      '<span class="pill" style="background:' + (sm ? g[2] : "var(--line-strong)") + ';opacity:' + op + '"></span>' +
    "</button>";
  }).join("");

  el.querySelectorAll(".day").forEach(b =>
    b.addEventListener("click", () => { state.date = b.dataset.d; renderForecastPage(); }));

  const di = $("#date");
  di.min = dates[0];
  di.max = dates[dates.length - 1];
  di.value = state.date;
}

/* ============================ 입수 가능 여부 (기상청 풍랑특보) ============================
   /api/advisory 는 Cloudflare Worker 가 공공데이터포털 기상특보 조회서비스를 대리 호출해
   돌려준다(src/worker.js). 서비스 인증키가 아직 없으면 ready:false 가 오고, 그 상태를
   그대로 "연동 준비 중" 배너로 보여준다 — 인증키가 들어오는 순간 코드 변경 없이 실데이터로
   전환된다.

   중요: 이 값은 "지금 이 순간" 발효 중인 특보다. 기상청은 미래 특정 날짜에 특보가 내려질지
   미리 알려주는 구조화된 예보 데이터를 제공하지 않는다. 그래서 이 배너는 날짜 칩 선택과
   무관하게 항상 현재 시각 기준으로만 표시된다.
================================================================================ */
const ADVISORY_INFO = {
  0: { label: "평소",      detail: "입수 가능",                icon: "✅" },
  1: { label: "풍랑주의보", detail: "신고서 작성 후 입수 가능",   icon: "⚠️" },
  2: { label: "풍랑경보",   detail: "입수 불가",                icon: "⛔" }
};
const KMA_LINK = "https://www.weather.go.kr/w/ocean/warning.do";

// 풍랑ㆍ호우ㆍ대설ㆍ강풍 "주의보"가 발효된 해역에서 파도·바람만으로 움직이는 수상레저기구
// (서프보드 포함, 무동력)로 활동하려면 해양경찰청에 신고해야 한다 — 확인된 근거:
// https://boat.kcg.go.kr/home/wtrlsrActInfo/weathrSpcnwsDclr/infoView1.do
// "경보" 단계는 이 신고 대상이 아니라 애초에 입수 자체가 금지라, 링크는 주의보(level 1)
// 에서만 보여준다. 이 페이지는 신고서 자체가 아니라 해양경찰청 실명인증 로그인 이후
// 신고로 이어지는 안내 페이지다 — 눌렀을 때 로그인 화면이 나오는 게 정상이다.
const REPORT_LINK = "https://boat.kcg.go.kr/home/wtrlsrActInfo/weathrSpcnwsDclr/infoView1.do";

let advisoryPromise = null;
function loadAdvisory(){
  if (!advisoryPromise){
    // 실패해도 reject 하지 않고 ready:false 로 눙쳐서, render() 의 에러 경로가
    // 파도 예보 실패 때문인지와 뒤섞이지 않게 한다.
    advisoryPromise = fetch("/api/advisory")
      .then(r => r.json())
      .catch(() => ({ ready: false, reason: "fetch_failed" }));
  }
  return advisoryPromise;
}

function renderAdvisoryBanner(advisory, spotId){
  if (!advisory || !advisory.ready){
    return '<div class="advisory adv-pending"><div class="advisory-top">' +
      '<span class="adv-ic" aria-hidden="true">🕓</span>' +

        '<div class="adv-detail">기상청 공식 연동 전입니다 · 출항·입수 전 직접 확인하세요</div>' +
      '</div>' +
      '<span class="adv-note"><a href="' + KMA_LINK + '" target="_blank" rel="noopener">기상청 해상특보 바로가기</a></span>' +
    '</div></div>';
  }
  const s = advisory.spots && advisory.spots[spotId];
  const lvl = s ? s.level : 0;
  const info = ADVISORY_INFO[lvl] || ADVISORY_INFO[0];
  // 주의보일 때만: 신고 대상이 바로 이 단계이기 때문. 경보는 신고가 아니라 입수 자체가
  // 금지라 이 버튼을 보여줄 이유가 없다.
  const cta = lvl === 1
    ? '<div class="adv-cta-row">' +

          '📝 수상레저활동 신고하러 가기 →</a>' +
        '<span class="adv-cta-hint">해양경찰청 실명인증 로그인이 필요합니다</span>' +
      '</div>'
    : '';

    '<span class="adv-ic" aria-hidden="true">' + info.icon + '</span>' +
    '<div class="adv-main">' +
      '<div class="adv-label">' + info.label + '</div>' +
      '<div class="adv-detail">' + info.detail + (s && s.zone ? " · " + esc(s.zone) : "") + '</div>' +
    '</div>' +
    '<span class="adv-note">지금 기준 · <a href="' + KMA_LINK + '" target="_blank" rel="noopener">기상청 확인</a></span>' +
  '</div>' + cta + '</div>';
}

let reqId = 0;

async function renderForecastPage(){
  // 주의: 여기서 readURL() 을 다시 호출하면 안 된다 — 날짜 칩·포인트 셀렉트 변경
  // 핸들러가 state 를 먼저 바꾼 뒤 이 함수를 직접 부르는데, 그 시점엔 URL 이 아직
  // 갱신 전(writeURL 은 아래에서 호출)이라 readURL() 이 그 변경을 도로 덮어써 버린다.
  // URL → state 동기화는 /forecast 라우트 "진입" 시점에만, renderRoute() 에서 한다.
  const my = ++reqId;
  const spot = SPOTS.find(s => s.id === state.spot);
  $("#spot").value = state.spot;
  writeURL();

  app.innerHTML = '<div class="card"><div class="state"><div class="spin"></div>' +
    esc(spot.name) + " 예보를 불러오는 중…</div></div>";

  let data, advisory;
  try {
    [data, advisory] = await Promise.all([ loadSpot(spot), loadAdvisory() ]);
  } catch (e){
    if (my !== reqId) return;
    app.innerHTML = '<div class="card"><div class="state">' +
      '<div class="err">예보를 불러오지 못했습니다.</div>' +
      '<div style="margin-top:6px;font-size:12px" class="dimc">' + esc(e.message) + "</div>" +
      '<button class="retry" id="retry" type="button">다시 시도</button></div></div>';
    $("#retry").addEventListener("click", () => { cache.delete(spot.id); renderForecastPage(); });
    return;
  }
  if (my !== reqId) return;

  if (data.dates.indexOf(state.date) < 0) state.date = data.dates[0];
  buildDays(data.dates, data);
  writeURL();

  const hours = data.byDate.get(state.date) || [];
  const sm = summarize(hours);
  if (!sm){
    app.innerHTML = '<div class="card"><div class="state">이 날짜의 예보 데이터가 아직 없습니다.</div></div>';
    return;
  }

  app.innerHTML =
    renderAdvisoryBanner(advisory, spot.id) +
    renderHero(spot, state.date, sm) +
    '<div class="card">' +
      "<h2>시간대별 파고</h2>" +
      '<div class="sub">아래 막대 색은 서핑 컨디션 점수 · 그래프를 짚으면 상세가 나옵니다</div>' +
      renderChart(hours) +
      '<div class="legend">' +
        GRADES.slice().reverse().map(g =>
          '<span><i class="dot" style="background:' + g[2] + '"></i>' + g[1] + "</span>").join("") +
      "</div>" +
    "</div>" +
    '<div class="card">' +
      "<h2>상세 예보</h2>" +
      '<div class="sub">파향·풍향 화살표는 파도와 바람이 <b>진행하는 방향</b>을 가리킵니다</div>' +
      renderTable(hours) +
    "</div>";

  wireChart(hours);
}

   /api/reports 를 씀 — src/worker.js 가 D1(reports 테이블)에 저장/조회한다.
   D1 바인딩이 아직 없으면 advisory 와 같은 패턴으로 { ready:false } 가 오고,
   화면은 에러가 아니라 "첫 제보를 남겨보세요" 같은 친절한 빈 상태로 그린다.
============================================================================ */
function spotNameOf(id){
  const s = SPOTS.find(x => x.id === id);
  return s ? s.name : id;
}

/** ISO 문자열 → "3분 전"/"2시간 전"/"어제"/"3일 전" 같은 상대 시각 */
function relTime(iso){
  const t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return "";
  const min = Math.max(0, Math.floor((Date.now() - t) / 60000));
  if (min < 1) return "방금 전";
  if (min < 60) return min + "분 전";
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "시간 전";
  const day = Math.floor(hr / 24);
  if (day === 1) return "어제";
  if (day < 7) return day + "일 전";
  const d = new Date(t);
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일";
}

const stars = n => isNum(n) ? "★".repeat(clamp(Math.round(n), 0, 5)) + "☆".repeat(5 - clamp(Math.round(n), 0, 5)) : "";
const excerpt = (s, n) => (s.length > n ? s.slice(0, n) + "…" : s);

/* 홈의 "최근 파도 제보"와 /reports 목록이 같은 카드를 재사용한다.
   nickname/body 는 사용자 입력이라 반드시 esc() 를 거쳐 innerHTML 에 들어간다. */
function renderReportCard(r){
  return '<article class="report-card">' +
    '<div class="report-head">' +
      '<span class="badge spot-badge">' + esc(spotNameOf(r.spotId)) + '</span>' +
      '<span class="report-nick">' + esc(r.nickname) + '</span>' +
      '<span class="report-time dimc">' + esc(relTime(r.createdAt)) + '</span>' +
    '</div>' +
    (isNum(r.rating) ? '<div class="report-stars">' + stars(r.rating) + '</div>' : '') +
    '<p class="report-body">' + esc(excerpt(String(r.body), 100)) + '</p>' +
    (isNum(r.waveHeight) ? '<div class="report-wh muted">체감 파고 ' + r.waveHeight.toFixed(1) + ' m</div>' : '') +
  '</article>';
}

   실패해도 다른 쪽을 막지 않는다.

function lastSpotOrDefault(){
  let id = "jukdo";
  try {
    const saved = localStorage.getItem("wt:lastSpot");
    if (saved && SPOTS.some(s => s.id === saved)) id = saved;
  } catch (_){ /* 일부 컨텍스트(프라이빗 모드 등)에서 localStorage 접근이 막혀 있을 수 있음 */ }
  return SPOTS.find(s => s.id === id) || SPOTS[0];
}

async function loadHomeToday(my, spot){
  const el = $("#home-today");
  const today = ymd(nowKST());
  try {
    const [data, advisory] = await Promise.all([ loadSpot(spot), loadAdvisory() ]);
    if (my !== reqId) return;
    const dateStr = data.dates.indexOf(today) >= 0 ? today : data.dates[0];
    const sm = summarize(data.byDate.get(dateStr) || []);

    el.innerHTML =
      renderAdvisoryBanner(advisory, spot.id) +

    el.innerHTML = '<div class="state"><div class="err">예보를 불러오지 못했습니다.</div></div>';
  }

  const el = $("#home-reports");

    if (my !== reqId) return;
    if (!data.ready || !data.reports.length){ el.innerHTML = reportsEmptyState(true); return; }
    el.innerHTML = '<div class="report-list">' + data.reports.map(renderReportCard).join("") + '</div>' +
      '<div class="home-more-row"><a href="/reports" data-nav class="home-more">제보 전체 보기 →</a></div>';
  } catch (e){
    if (my !== reqId) return;
    el.innerHTML = reportsEmptyState(true);
  }
}

/* ============================ 파도제보 (/reports) ============================ */
function reportSpotOptions(selected){
  return SPOTS.map(s =>
    '<option value="' + s.id + '"' + (s.id === selected ? " selected" : "") + '>' + esc(s.name) + '</option>'
  ).join("");
}

function renderReportForm(){
  const lastSpot = lastSpotOrDefault().id;
  const ratingOpts = [5, 4, 3, 2, 1].map(n =>
    '<option value="' + n + '">' + "★".repeat(n) + "☆".repeat(5 - n) + '</option>').join("");
  return '<div class="card">' +
    '<h2>파도 제보 남기기</h2>' +
    '<div class="sub">방금 다녀온 포인트의 파도 상태를 알려주세요</div>' +
    '<form id="reportForm" class="rform" novalidate>' +
      '<div class="rf-row">' +
        '<label class="fld"><span>포인트</span><select id="rf-spot" required>' + reportSpotOptions(lastSpot) + '</select></label>' +
        '<label class="fld"><span>닉네임</span><input id="rf-nick" type="text" maxlength="20" placeholder="예: 죽도서퍼" required></label>' +
      '</div>' +
      '<div class="rf-row">' +
        '<label class="fld"><span>별점</span><select id="rf-rating"><option value="">선택 안 함</option>' + ratingOpts + '</select></label>' +
        '<label class="fld"><span>체감 파고(m)</span><input id="rf-wh" type="number" min="0" max="15" step="0.1" placeholder="예: 1.2"></label>' +
      '</div>' +
      '<div class="rf-textarea-wrap">' +
        '<span>내용</span>' +
        '<textarea id="rf-body" maxlength="500" rows="4" placeholder="파도 상태, 바람, 사람 많은지 등을 자유롭게 적어주세요" required></textarea>' +
      '</div>' +
      '<div class="rf-foot">' +
        '<span id="rf-count" class="dimc rf-count">0 / 500</span>' +
        '<button type="submit" id="rf-submit" class="rf-submit">제보 등록</button>' +
      '</div>' +
      '<div id="rf-msg" class="rf-msg" role="status" aria-live="polite"></div>' +
    '</form>' +
  '</div>';
}

/** 서버 검증 규칙을 그대로 거울처럼 복제 — 왕복 없이 바로 안내하기 위함.
    최종 판단은 항상 서버가 하므로(아래 fetch), 여기서 뚫려도 보안엔 영향 없다. */
function validateReportClient(p){
  if (!SPOTS.some(s => s.id === p.spotId)) return "포인트를 선택해주세요.";
  if (p.nickname.length < 1 || p.nickname.length > 20) return "닉네임은 1~20자로 입력해주세요.";
  if (p.body.length < 1 || p.body.length > 500) return "내용은 1~500자로 입력해주세요.";
  if (p.rating !== undefined && (!Number.isInteger(p.rating) || p.rating < 1 || p.rating > 5)) return "별점은 1~5 사이여야 합니다.";
  if (p.waveHeight !== undefined && (!isNum(p.waveHeight) || p.waveHeight < 0 || p.waveHeight > 15)) return "체감 파고는 0~15m 사이여야 합니다.";
  return null;
}

function prependReport(r){
  const list = $("#report-list");
  if (!list) return;
  let grid = list.querySelector(".report-list");
  if (!grid){ list.innerHTML = '<div class="report-list"></div>'; grid = list.querySelector(".report-list"); }
  grid.insertAdjacentHTML("afterbegin", renderReportCard(r));
}

function wireReportForm(){
  const form = $("#reportForm");
  const bodyEl = $("#rf-body"), counter = $("#rf-count");
  const updateCount = () => { counter.textContent = bodyEl.value.length + " / 500"; };
  bodyEl.addEventListener("input", updateCount);
  updateCount();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("#rf-msg");
    const submitBtn = $("#rf-submit");
    const ratingVal = $("#rf-rating").value;
    const whVal = $("#rf-wh").value;
    const payload = {
      spotId: $("#rf-spot").value,
      nickname: $("#rf-nick").value.trim(),
      body: $("#rf-body").value.trim(),
    };
    if (ratingVal !== "") payload.rating = +ratingVal;
    if (whVal !== "") payload.waveHeight = +whVal;

    const clientErr = validateReportClient(payload);
    if (clientErr){
      msg.textContent = clientErr;
      msg.className = "rf-msg rf-err";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="rf-spin"></span>등록 중…';
    msg.textContent = "";
    msg.className = "rf-msg";

    try {
      const res = await fetch("/api/reports", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
      const j = await res.json().catch(() => ({}));
      if (res.status === 201 && j && j.report){
        prependReport(j.report);
        form.reset();
        updateCount();
        msg.textContent = "제보가 등록되었습니다. 감사합니다!";
        msg.className = "rf-msg rf-ok";
      } else if (res.status === 429){
        msg.textContent = (j && j.message) || "너무 많은 요청입니다. 잠시 후 다시 시도해주세요.";
        msg.className = "rf-msg rf-err";
      } else if (res.status === 503){
        msg.textContent = (j && j.message) || "현재 제보 기능을 사용할 수 없습니다. 잠시 후 다시 시도해주세요.";
        msg.className = "rf-msg rf-err";
      } else if (res.status === 400){
        msg.textContent = (j && j.message) || "입력값을 다시 확인해주세요.";
        msg.className = "rf-msg rf-err";
      } else {
        msg.textContent = "제보 등록에 실패했습니다. 잠시 후 다시 시도해주세요.";
        msg.className = "rf-msg rf-err";
      }
    } catch (e2){
      msg.textContent = "네트워크 오류로 제보를 등록하지 못했습니다.";
      msg.className = "rf-msg rf-err";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "제보 등록";
    }
  });
}

async function renderReportsPage(){
  const my = ++reqId;
  app.innerHTML =
    renderReportForm() +
    '<div class="card">' +
      "<h2>최근 제보</h2>" +
      '<div class="sub">최신 30개</div>' +
      '<div id="report-list"><div class="state"><div class="spin"></div>제보를 불러오는 중…</div></div>' +
    "</div>";
  wireReportForm();

  try {
    const data = await fetchReports(30);
    if (my !== reqId) return;
    const list = $("#report-list");
    if (!data.ready || !data.reports.length) list.innerHTML = reportsEmptyState(false);
    else list.innerHTML = '<div class="report-list">' + data.reports.map(renderReportCard).join("") + '</div>';
  } catch (e){
    if (my !== reqId) return;
    $("#report-list").innerHTML = reportsEmptyState(false);
  }
}

/* ============================ 라우팅 ============================
   경로 3개: / (홈) · /forecast (파도예보) · /reports (파도제보).
   해시 라우팅 대신 History API 를 쓴다 — wrangler.jsonc 의
   assets.not_found_handling: "single-page-application" 덕분에 /forecast, /reports
   를 새로고침해도(또는 직접 주소창에 쳐도) 그대로 이 index.html 이 서빙된다.
================================================================== */
const TITLE_OF = {
  home:     "WaveTracer — 국내 서핑 파도 예보",
  forecast: "WaveTracer — 파도예보",
  reports:  "WaveTracer — 파도 제보",
};

/** 현재 location 을 라우트 이름으로 해석.
    - 옛 공유 링크(예: /?spot=jukdo&date=...)는 /forecast 로 보정한다.
    - 알 수 없는 경로는 홈으로 보정한다.
    둘 다 replaceState 라 브라우저 히스토리를 어지럽히지 않는다. */
function resolveRoute(){
  const path = location.pathname;
  if (path === "/"){
    if (/[?&](spot|date)=/.test(location.search)){
      history.replaceState(null, "", "/forecast" + location.search);
      return "forecast";
    }
    return "home";
  }
  if (path === "/forecast") return "forecast";
  if (path === "/reports") return "reports";
  history.replaceState(null, "", "/");
  return "home";
}

function updateChrome(route){
  document.title = TITLE_OF[route];
  $("#controls").hidden = route !== "forecast";
  $$(".tab").forEach(a => {
    if (a.dataset.route === route) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
}

function renderRoute(){
  const route = resolveRoute();
  updateChrome(route);
  if (route === "forecast"){
    readURL(); // /forecast 로 "진입"할 때만 쿼리(?spot=&date=)를 state 에 반영
    renderForecastPage();
  }
  else if (route === "reports") renderReportsPage();
  else renderHomePage();
}

function navigate(path){
  if (path !== location.pathname + location.search) history.pushState(null, "", path);
  renderRoute();
}

window.addEventListener("popstate", renderRoute);

// 로고·탭·"전체 보기" 링크 등 data-nav 를 단 내부 링크는 전부 여기서 가로채
// pushState 로 처리한다 — 전체 새로고침 없이 SPA 로 전환된다.
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-nav]");
  if (!a) return;
  e.preventDefault();
  navigate(a.getAttribute("href"));
});

/* ============================ init ============================ */
buildSpotSelect();
$("#date").value = state.date;

$("#spot").addEventListener("change", e => {
  state.spot = e.target.value;
  try { localStorage.setItem("wt:lastSpot", state.spot); } catch (_){}
  renderForecastPage();
});
$("#date").addEventListener("change", e => {
  if (e.target.value){ state.date = e.target.value; renderForecastPage(); }
});

renderRoute();
</script>
